[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "asfanit"
description = "Various data collection utilities and scripts"
license = "MIT"
authors = [
    { name = "Rachel Domagalski" },
]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "aranet4",
    "bleak",
    "click",
    "coloredlogs",
    "influxdb3-python",
    "requests",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "ipython",
    "pre-commit",
    "pytest",
]

[project.scripts]
asfanit = "asfanit:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["asfanit*"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.setuptools_scm]
# Version is derived from git tags (e.g. v0.1.11 -> 0.1.11).
# Falls back to a dev-version scheme when no tag is present.

[tool.black]
line-length = 100
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | old
  | __pycache__
)/
'''
